# Runtime of the Claude plugin: pins hu-eli-mcp and every transitive dependency
# (with hashes) in uv.lock, so the plugin runs exactly what was reviewed.
# Started by plugin.json as: uvx hu-eli-mcp==0.3.3 (Claude Code's locked launch reads this uv.lock)
[project]
name = "hu-eli-mcp-plugin-runtime"
version = "0.3.3"
requires-python = ">=3.11,<3.14"
dependencies = ["hu-eli-mcp==0.3.3"]

[tool.uv]
package = false
